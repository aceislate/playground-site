<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground</title>
    <link rel="icon" type="image/x-icon"
      href="https://cdn.jsdelivr.net/gh/aceislate/playground-site@main/favicon.ico" />
    <style>
      html, body { margin: 0; height: 100%; background: #0a0f1e; overflow: hidden; }
      #app {
        position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
        background: #0a0f1e;
      }
      #boot {
        position: fixed; inset: 0; z-index: 2;
        display: flex; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 35%, #1a2744 0%, #0a0f1e 70%);
        color: #9aa7c2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 15px; transition: opacity 0.45s ease;
      }
      #boot.hide { opacity: 0; pointer-events: none; }
      .spin {
        width: 34px; height: 34px; margin-right: 12px; border-radius: 50%;
        border: 3px solid rgba(255, 255, 255, 0.15); border-top-color: #4f7ef5;
        animation: s 0.8s linear infinite;
      }
      @keyframes s { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="boot"><div class="spin"></div><span id="bootMsg">Loading Playground…</span></div>
    <iframe id="app" allow="fullscreen; autoplay; gamepad; clipboard-write; cross-origin-isolated" allowfullscreen></iframe>

    <!-- The whole site is served from jsDelivr. jsDelivr serves .html as plain text,
         so FrameWriter fetches each page and writes it into the iframe with a jsDelivr
         <base href> — pages, scripts, images and games all resolve to jsDelivr, whose
         cache can be purged instantly (purge.jsdelivr.net). This shell is the only
         file served elsewhere; it never changes, so its cache doesn't matter. -->
    <script src="https://cdn.jsdelivr.net/gh/aceislate/playground-site@main/js/framewriter.js"></script>
    <script>
      (function () {
        var CDN = "https://cdn.jsdelivr.net/gh/aceislate/playground-site@main";
        var frame = document.getElementById("app");
        var boot = document.getElementById("boot");
        var bootMsg = document.getElementById("bootMsg");

        // ?p=games.html lets you deep-link to a specific page; default is the home page.
        var p = (new URLSearchParams(location.search).get("p") || "index.html").replace(/^\/+/, "");
        var start = CDN + "/" + p;

        if (!window.FrameWriter) {
          bootMsg.textContent = "Couldn't reach jsDelivr. Check your connection and refresh.";
          return;
        }

        FrameWriter.load(frame, start)
          .then(function () { setTimeout(function () { boot.classList.add("hide"); }, 200); })
          .catch(function () {
            bootMsg.textContent = "Couldn't load the site. Refresh to try again.";
          });
      })();
    </script>
  </body>
</html>
