<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Apps | Playground</title>
    <meta name="description" content="Handy everyday apps: calculator, notes, converters, and more." />
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>

    <div class="container">
      <div class="page-head"><h1 class="page-title">Apps</h1><span class="pill" id="count-pill"></span></div>
<label class="search-wrap"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="text" id="search" class="search-bar" placeholder="Search" autocomplete="off" /></label>
      <div id="loader" class="loader"></div>
      <div id="app-container" class="grid"></div>
      <p id="empty-msg" class="empty-msg" style="display:none;">No apps matched your search.</p>
    </div>

    <button id="back-to-top" style="display: none;">&uarr;</button>

    <nav class="dock">
      <a href="index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>

    <script src="js/main.js"></script>
    <script src="js/particles.js"></script>
    <script>
      let apps = [];

      function cardHtml(a, i) {
        return `<a class="card-link" style="--i:${i % 24}" href="${a.link}">
          <div class="card">
            <div class="card-img-wrap"><img src="${a.imgSrc}" alt="${a.title}" loading="lazy" /></div>
            <div class="card-body">
              <p class="card-title">${a.title}</p>
              <p class="card-desc">${a.desc || ""}</p>
            </div>
          </div>
        </a>`;
      }

      function render(list) {
        const container = document.getElementById("app-container");
        container.innerHTML = list.map(cardHtml).join("");
        document.getElementById("empty-msg").style.display = list.length ? "none" : "block";
      }

      fetch("config/apps.json")
        .then((r) => r.json())
        .then((data) => {
          apps = data;
          document.getElementById("count-pill").textContent = `${apps.length} apps`;
          render(apps);
          document.getElementById("loader").style.display = "none";
        })
        .catch((err) => {
          document.getElementById("loader").style.display = "none";
          console.error("Error loading apps:", err);
        });

      document.getElementById("search").addEventListener("keyup", (e) => {
        const filter = e.target.value.toUpperCase();
        render(apps.filter((a) => a.title.toUpperCase().includes(filter) || (a.desc || "").toUpperCase().includes(filter)));
      });

      const backToTopButton = document.getElementById("back-to-top");
      window.onscroll = function () {
        backToTopButton.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
      };
      backToTopButton.onclick = function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };
    </script>
  </body>
</html>
