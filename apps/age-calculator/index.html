<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>Age Calculator | Playground</title>
    <style>
      .age-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.8rem; margin-top: 1rem; }
      .age-stat { background: var(--bg-alt); border-radius: 10px; padding: 0.8rem; text-align: center; }
      .age-stat b { display: block; font-size: 1.5rem; color: var(--green); }
      .age-stat span { font-size: 0.8rem; color: var(--text-dim); }
      .next-bday { text-align: center; margin-top: 1rem; color: var(--text-dim); }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>🎂 Age Calculator</h1>
      <div class="app-box">
        <div class="field"><label for="dob">Date of birth</label><input type="date" id="dob" oninput="calc()" /></div>
        <div class="age-grid">
          <div class="age-stat"><b id="years">-</b><span>Years</span></div>
          <div class="age-stat"><b id="months">-</b><span>Months</span></div>
          <div class="age-stat"><b id="days">-</b><span>Days</span></div>
        </div>
        <div class="next-bday" id="nextBday"></div>
      </div>
    </div>
    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>
    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      function calc() {
        const val = document.getElementById("dob").value;
        if (!val) return;
        const dob = new Date(val + "T00:00:00");
        const now = new Date();
        if (dob > now) {
          document.getElementById("nextBday").textContent = "That date is in the future.";
          return;
        }

        let years = now.getFullYear() - dob.getFullYear();
        let months = now.getMonth() - dob.getMonth();
        let days = now.getDate() - dob.getDate();

        if (days < 0) {
          months--;
          const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
          days += prevMonth.getDate();
        }
        if (months < 0) {
          years--;
          months += 12;
        }

        document.getElementById("years").textContent = years;
        document.getElementById("months").textContent = months;
        document.getElementById("days").textContent = days;

        let next = new Date(now.getFullYear(), dob.getMonth(), dob.getDate());
        if (next < now) next.setFullYear(now.getFullYear() + 1);
        const diffDays = Math.ceil((next - now) / 86400000);
        document.getElementById("nextBday").textContent = `${diffDays} day${diffDays === 1 ? "" : "s"} until your next birthday.`;
      }

      document.getElementById("dob").value = "2000-01-01";
      calc();
    </script>
  </body>
</html>
