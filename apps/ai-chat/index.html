<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>AI Chat | Playground</title>
    <style>
      .app-shell.chat-shell {
        max-width: 1100px;
        height: 100vh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
      }
      .app-shell.chat-shell .back-link,
      .app-shell.chat-shell h1 {
        flex: none;
      }
      .app-box.chat-box {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding: 1.25rem;
      }
      .chat-window {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.9rem;
        overflow-y: auto;
        padding: 0.75rem;
        margin-bottom: 1rem;
        border-radius: var(--radius);
        background: rgba(0, 0, 0, 0.15);
      }
      .msg {
        flex: none;
        max-width: 80%;
        padding: 0.85rem 1.05rem;
        border-radius: 14px;
        line-height: 1.55;
        font-size: 1.05rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .msg.user {
        align-self: flex-end;
        background: var(--purple);
        color: #fff;
      }
      .msg.assistant {
        align-self: flex-start;
        background: var(--bg-alt);
        border: 1px solid var(--purple);
      }
      .msg.system {
        align-self: center;
        color: var(--text-dim);
        font-size: 0.9rem;
        font-style: italic;
      }
      .typing-dots span {
        display: inline-block;
        width: 6px;
        height: 6px;
        margin-right: 3px;
        border-radius: 50%;
        background: var(--text-dim);
        animation: blink 1.2s infinite;
      }
      .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
      .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
      .chat-input-row {
        flex: none;
        display: flex;
        gap: 0.6rem;
      }
      .chat-input-row textarea {
        flex: 1;
        resize: none;
        min-height: 56px;
        max-height: 160px;
        font-size: 1.05rem;
      }
      .chat-input-row .btn {
        font-size: 1.05rem;
        padding: 0 1.6rem;
      }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell md chat-shell">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>🤖 AI Chat (note very inconsistent can go down at any time)</h1>

      <div class="app-box chat-box">
        <div class="chat-window" id="chatWindow"></div>

        <div class="chat-input-row">
          <textarea id="chatInput" placeholder="Ask me anything..." rows="1"></textarea>
          <button class="btn btn-green" id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
      </div>
    </div>

    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>

    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      const WORKER_URL = "https://ai.justacemorrison.workers.dev/";
      const SYSTEM_PROMPT =
        "Reply in plain text only. Do not use markdown formatting of any kind: " +
        "no asterisks for bold or italics, no backticks or code fences, no headings, " +
        "no bullet or numbered list syntax, no links in brackets. Just write plain sentences " +
        "and paragraphs, using line breaks for lists if needed.";
      const history = [];

      function addMessage(role, text) {
        const win = document.getElementById("chatWindow");
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        div.textContent = text;
        win.appendChild(div);
        win.scrollTop = win.scrollHeight;
        return div;
      }

      function setTyping(div) {
        div.innerHTML = '<span class="typing-dots"><span></span><span></span><span></span></span>';
      }

      async function sendMessage() {
        const input = document.getElementById("chatInput");
        const text = input.value.trim();
        if (!text) return;

        input.value = "";
        addMessage("user", text);
        history.push({ role: "user", content: text });

        const sendBtn = document.getElementById("sendBtn");
        sendBtn.disabled = true;

        const assistantDiv = addMessage("assistant", "");
        setTyping(assistantDiv);
        let full = "";

        try {
          const response = await fetch(WORKER_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              messages: [{ role: "system", content: SYSTEM_PROMPT }, ...history],
              stream: true,
            }),
          });

          if (!response.ok || !response.body) {
            throw new Error(`Request failed (${response.status})`);
          }

          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";

          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });

            const lines = buffer.split("\n");
            buffer = lines.pop();

            for (const line of lines) {
              const trimmed = line.trim();
              if (!trimmed.startsWith("data:")) continue;
              const data = trimmed.slice(5).trim();
              if (data === "[DONE]") continue;
              try {
                const json = JSON.parse(data);
                const delta = json.choices?.[0]?.delta?.content || json.choices?.[0]?.message?.content || "";
                if (delta) {
                  full += delta;
                  assistantDiv.textContent = full;
                  const win = document.getElementById("chatWindow");
                  win.scrollTop = win.scrollHeight;
                }
              } catch (e) {
                // Ignore malformed SSE chunks.
              }
            }
          }

          if (!full) assistantDiv.textContent = "(no response)";
          history.push({ role: "assistant", content: full });
        } catch (err) {
          assistantDiv.textContent = `Error: ${err.message}`;
        } finally {
          sendBtn.disabled = false;
        }
      }

      document.getElementById("chatInput").addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendMessage();
        }
      });
    </script>
  </body>
</html>
