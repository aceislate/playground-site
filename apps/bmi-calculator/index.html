<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>BMI Calculator | Playground</title>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>⚖️ BMI Calculator</h1>
      <div class="app-box">
        <div class="field">
          <label for="unit">Units</label>
          <select id="unit" onchange="calc()">
            <option value="metric">Metric (kg / cm)</option>
            <option value="imperial">Imperial (lb / in)</option>
          </select>
        </div>
        <div class="row field">
          <div><label for="weight">Weight</label><input type="number" id="weight" value="70" oninput="calc()" /></div>
          <div><label for="height">Height</label><input type="number" id="height" value="175" oninput="calc()" /></div>
        </div>
        <div class="result" id="result">--</div>
        <div style="text-align:center; color: var(--text-dim); font-size: 0.9rem;" id="category"></div>
      </div>
    </div>
    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>
    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      function calc() {
        const unit = document.getElementById("unit").value;
        let w = parseFloat(document.getElementById("weight").value);
        let h = parseFloat(document.getElementById("height").value);
        if (!w || !h) return;

        let bmi;
        if (unit === "metric") {
          bmi = w / ((h / 100) ** 2);
        } else {
          bmi = (703 * w) / (h * h);
        }
        bmi = Math.round(bmi * 10) / 10;
        document.getElementById("result").textContent = `BMI: ${bmi}`;

        let cat, color;
        if (bmi < 18.5) { cat = "Underweight"; color = "#eab308"; }
        else if (bmi < 25) { cat = "Normal weight"; color = "#22c55e"; }
        else if (bmi < 30) { cat = "Overweight"; color = "#f97316"; }
        else { cat = "Obese"; color = "#ef4444"; }
        const catEl = document.getElementById("category");
        catEl.textContent = cat;
        catEl.style.color = color;
      }
      calc();
    </script>
  </body>
</html>
