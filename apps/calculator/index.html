<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>Calculator | Playground</title>
    <style>
      .calc-display {
        background: var(--bg-alt);
        border-radius: 12px;
        padding: 1rem;
        text-align: right;
        font-size: 2.2rem;
        margin-bottom: 1rem;
        overflow-x: auto;
        min-height: 3.2rem;
        word-break: break-all;
      }
      .calc-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.6rem;
      }
      .calc-grid button {
        cursor: pointer;
        border: none;
        border-radius: 10px;
        background: var(--bg-alt);
        color: var(--text);
        font-size: 1.2rem;
        padding: 1rem 0;
      }
      .calc-grid button:active {
        background: var(--card-hover);
      }
      .calc-grid button.op { background: rgba(168, 85, 247, 0.2); color: var(--purple); }
      .calc-grid button.eq { background: linear-gradient(135deg, var(--accent2), #16a34a); color: #06210f; font-weight: 700; }
      .calc-grid button.clear { background: rgba(239, 68, 68, 0.18); color: #ff6b6b; }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>🧮 Calculator</h1>
      <div class="app-box">
        <div class="calc-display" id="display">0</div>
        <div class="calc-grid">
          <button class="clear" onclick="clearAll()">C</button>
          <button onclick="backspace()">⌫</button>
          <button class="op" onclick="append('%')">%</button>
          <button class="op" onclick="append('/')">÷</button>

          <button onclick="append('7')">7</button>
          <button onclick="append('8')">8</button>
          <button onclick="append('9')">9</button>
          <button class="op" onclick="append('*')">×</button>

          <button onclick="append('4')">4</button>
          <button onclick="append('5')">5</button>
          <button onclick="append('6')">6</button>
          <button class="op" onclick="append('-')">−</button>

          <button onclick="append('1')">1</button>
          <button onclick="append('2')">2</button>
          <button onclick="append('3')">3</button>
          <button class="op" onclick="append('+')">+</button>

          <button onclick="append('0')" style="grid-column: span 2;">0</button>
          <button onclick="append('.')">.</button>
          <button class="eq" onclick="calculate()">=</button>
        </div>
      </div>
    </div>
    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>
    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      const display = document.getElementById("display");
      let expr = "";
      const allowed = /^[0-9+\-*/.%\s]*$/;

      function render() {
        display.textContent = expr === "" ? "0" : expr.replace(/\*/g, "×").replace(/\//g, "÷");
      }

      function append(v) {
        expr += v;
        render();
      }

      function backspace() {
        expr = expr.slice(0, -1);
        render();
      }

      function clearAll() {
        expr = "";
        render();
      }

      function calculate() {
        if (!allowed.test(expr) || expr.trim() === "") return;
        try {
          const result = Function(`"use strict"; return (${expr.replace(/%/g, "/100")})`)();
          expr = Number.isFinite(result) ? String(Math.round(result * 1e10) / 1e10) : "Error";
        } catch (e) {
          expr = "Error";
        }
        render();
      }

      document.addEventListener("keydown", (e) => {
        if (/[0-9+\-*/.%]/.test(e.key)) append(e.key);
        else if (e.key === "Enter" || e.key === "=") calculate();
        else if (e.key === "Backspace") backspace();
        else if (e.key === "Escape") clearAll();
      });
    </script>
  </body>
</html>
