<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>Dice Roller | Playground</title>
    <style>
      .dice-display { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: center; margin: 1rem 0; min-height: 70px; }
      .die {
        width: 60px;
        height: 60px;
        border-radius: 12px;
        background: var(--bg-alt);
        border: 2px solid var(--purple);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.6rem;
        font-weight: 800;
      }
      .total { text-align: center; font-size: 1.2rem; color: var(--text-dim); margin-bottom: 1rem; }
      .total b { color: var(--green); font-size: 1.4rem; }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>🎲 Dice Roller</h1>
      <div class="app-box">
        <div class="row field">
          <div><label for="count">Number of dice</label><input type="number" id="count" value="2" min="1" max="12" /></div>
          <div><label for="sides">Sides per die</label><input type="number" id="sides" value="6" min="2" max="100" /></div>
        </div>
        <div class="dice-display" id="diceDisplay"></div>
        <div class="total" id="total"></div>
        <div style="text-align:center;"><button class="btn btn-green" onclick="roll()">Roll</button></div>
      </div>
    </div>
    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>
    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      function roll() {
        const count = Math.min(Math.max(parseInt(document.getElementById("count").value) || 1, 1), 12);
        const sides = Math.max(parseInt(document.getElementById("sides").value) || 6, 2);
        const display = document.getElementById("diceDisplay");
        display.innerHTML = "";
        let sum = 0;
        for (let i = 0; i < count; i++) {
          const val = 1 + Math.floor(Math.random() * sides);
          sum += val;
          const die = document.createElement("div");
          die.className = "die";
          die.textContent = val;
          display.appendChild(die);
        }
        document.getElementById("total").innerHTML = `Total: <b>${sum}</b>`;
      }
      roll();
    </script>
  </body>
</html>
