<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>Markdown Previewer | Playground</title>
    <style>
      .app-shell.md { max-width: 900px; }
      .md-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
      textarea#md-input { min-height: 420px; font-family: monospace; }
      .preview { background: var(--bg-alt); border-radius: 10px; padding: 1rem; min-height: 420px; overflow-y: auto; }
      .preview h1, .preview h2, .preview h3 { margin-top: 0.6em; }
      .preview code { background: #10131a; padding: 0.1em 0.4em; border-radius: 4px; }
      .preview pre { background: #10131a; padding: 0.8em; border-radius: 8px; overflow-x: auto; }
      .preview blockquote { border-left: 3px solid var(--purple); margin: 0.5em 0; padding-left: 1em; color: var(--text-dim); }
      .preview a { color: var(--green); }
      @media (max-width: 700px) { .md-cols { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell md">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>📄 Markdown Previewer</h1>
      <div class="app-box">
        <div class="md-cols">
          <textarea id="md-input"># Hello!

Type some **markdown** on the left.

- Lists work
- *Italics* and **bold**
- `inline code`

> Blockquotes too

[A link](https://example.com)
</textarea>
          <div class="preview" id="preview"></div>
        </div>
      </div>
    </div>
    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>
    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      function mdToHtml(md) {
        let html = escapeHtml(md);
        html = html.replace(/```([\s\S]*?)```/g, (m, code) => `<pre><code>${code.trim()}</code></pre>`);
        html = html.replace(/^### (.*$)/gim, "<h3>$1</h3>");
        html = html.replace(/^## (.*$)/gim, "<h2>$1</h2>");
        html = html.replace(/^# (.*$)/gim, "<h1>$1</h1>");
        html = html.replace(/^&gt; (.*$)/gim, "<blockquote>$1</blockquote>");
        html = html.replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>");
        html = html.replace(/\*(.*?)\*/g, "<em>$1</em>");
        html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
        html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        html = html.replace(/^\s*-\s+(.*)$/gim, "<li>$1</li>");
        html = html.replace(/(<li>[\s\S]*?<\/li>)/g, (m) => `<ul>${m}</ul>`);
        html = html.split(/\n{2,}/).map((block) => {
          if (/^<(h\d|ul|blockquote|pre)/.test(block.trim())) return block;
          return block.trim() ? `<p>${block.replace(/\n/g, "<br>")}</p>` : "";
        }).join("\n");
        return html;
      }

      const input = document.getElementById("md-input");
      const preview = document.getElementById("preview");

      function render() {
        preview.innerHTML = mdToHtml(input.value);
      }

      input.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
