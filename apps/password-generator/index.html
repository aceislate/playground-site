<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>Password Generator | Playground</title>
    <style>
      .pw-out {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.2rem;
      }
      .pw-out input { font-family: monospace; font-size: 1.1rem; }
      .pw-out button {
        cursor: pointer;
        border: none;
        border-radius: 10px;
        background: var(--purple);
        color: white;
        padding: 0 1rem;
        font-weight: 600;
      }
      .toggle-row { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; }
      .strength { margin-top: 0.8rem; font-size: 0.9rem; text-align: center; font-weight: 700; }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>🔐 Password Generator</h1>
      <div class="app-box">
        <div class="pw-out">
          <input type="text" id="output" readonly />
          <button onclick="copyPw()">Copy</button>
        </div>
        <div class="field">
          <label for="length">Length: <span id="lenVal">16</span></label>
          <input type="range" id="length" min="6" max="48" value="16" style="width:100%;" oninput="lenVal.textContent=length.value; generate();" />
        </div>
        <div class="toggle-row"><span>Uppercase (A-Z)</span><input type="checkbox" id="upper" checked onchange="generate()" /></div>
        <div class="toggle-row"><span>Lowercase (a-z)</span><input type="checkbox" id="lower" checked onchange="generate()" /></div>
        <div class="toggle-row"><span>Numbers (0-9)</span><input type="checkbox" id="numbers" checked onchange="generate()" /></div>
        <div class="toggle-row"><span>Symbols (!@#$...)</span><input type="checkbox" id="symbols" checked onchange="generate()" /></div>
        <div class="strength" id="strength"></div>
      </div>
    </div>
    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>
    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      const output = document.getElementById("output");
      const lenVal = document.getElementById("lenVal");
      const length = document.getElementById("length");
      const sets = {
        upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
        lower: "abcdefghijklmnopqrstuvwxyz",
        numbers: "0123456789",
        symbols: "!@#$%^&*()_+-=[]{}|;:,.<>?",
      };

      function generate() {
        let pool = "";
        Object.keys(sets).forEach((k) => {
          if (document.getElementById(k).checked) pool += sets[k];
        });
        if (!pool) {
          output.value = "Select at least one option";
          document.getElementById("strength").textContent = "";
          return;
        }
        const len = parseInt(length.value);
        const bytes = new Uint32Array(len);
        crypto.getRandomValues(bytes);
        let pw = "";
        for (let i = 0; i < len; i++) pw += pool[bytes[i] % pool.length];
        output.value = pw;

        const variety = Object.keys(sets).filter((k) => document.getElementById(k).checked).length;
        const score = len * variety;
        const strengthEl = document.getElementById("strength");
        if (score < 40) { strengthEl.textContent = "Weak"; strengthEl.style.color = "#ef4444"; }
        else if (score < 80) { strengthEl.textContent = "Good"; strengthEl.style.color = "#eab308"; }
        else { strengthEl.textContent = "Strong"; strengthEl.style.color = "#22c55e"; }
      }

      function copyPw() {
        output.select();
        navigator.clipboard && navigator.clipboard.writeText(output.value);
      }

      generate();
    </script>
  </body>
</html>
