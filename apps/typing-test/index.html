<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
    <link rel="stylesheet" href="../../css/style.css" />
    <title>Typing Test | Playground</title>
    <style>
      .prompt { font-size: 1.2rem; line-height: 1.7; padding: 1rem; background: var(--bg-alt); border-radius: 10px; margin-bottom: 1rem; }
      .prompt span.correct { color: var(--green); }
      .prompt span.wrong { color: #ef4444; text-decoration: underline; }
      .prompt span.current { background: var(--purple); border-radius: 3px; }
      .stats { display: flex; justify-content: space-around; margin-top: 1rem; }
      .stat { text-align: center; }
      .stat b { display: block; font-size: 1.6rem; color: var(--green); }
      .stat span { font-size: 0.8rem; color: var(--text-dim); }
      textarea#typeInput { position: absolute; opacity: 0; height: 0; }
    </style>
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>
    <div class="app-shell">
      <a href="../../apps.html" class="back-link">&larr; Back to Apps</a>
      <h1>⌨️ Typing Test</h1>
      <div class="app-box">
        <div class="prompt" id="prompt"></div>
        <input type="text" id="typeInput" autofocus />
        <p style="text-align:center; color: var(--text-dim); font-size: 0.85rem;">Click here and start typing to begin.</p>
        <div class="stats">
          <div class="stat"><b id="wpm">0</b><span>WPM</span></div>
          <div class="stat"><b id="acc">100%</b><span>Accuracy</span></div>
          <div class="stat"><b id="timeLeft">30</b><span>Seconds</span></div>
        </div>
        <div style="text-align:center; margin-top:1rem;"><button class="btn btn-purple" onclick="reset()">Restart</button></div>
      </div>
    </div>
    <nav class="dock">
      <a href="../../index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="../../games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="../../apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="../../settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>
    <script src="../../js/main.js"></script>
    <script src="../../js/particles.js"></script>
    <script>
      const texts = [
        "The quick brown fox jumps over the lazy dog while the sun sets behind the hills.",
        "Practice makes perfect, and typing speed improves the more consistently you train.",
        "Simplicity is the ultimate sophistication when it comes to good software design.",
        "A journey of a thousand miles begins with a single step forward into the unknown.",
        "Great things are never done by one person, they are done by a team of people.",
      ];

      const promptEl = document.getElementById("prompt");
      const input = document.getElementById("typeInput");
      let text = "";
      let startTime = null;
      let timer = null;
      let timeLeft = 30;
      let finished = false;

      function pickText() {
        text = texts[Math.floor(Math.random() * texts.length)];
        promptEl.innerHTML = text.split("").map((c, i) => `<span ${i === 0 ? 'class="current"' : ""}>${c}</span>`).join("");
      }

      function reset() {
        clearInterval(timer);
        startTime = null;
        timeLeft = 30;
        finished = false;
        document.getElementById("timeLeft").textContent = timeLeft;
        document.getElementById("wpm").textContent = "0";
        document.getElementById("acc").textContent = "100%";
        input.value = "";
        pickText();
        input.focus();
      }

      input.addEventListener("input", () => {
        if (finished) return;
        if (!startTime) {
          startTime = Date.now();
          timer = setInterval(() => {
            timeLeft--;
            document.getElementById("timeLeft").textContent = Math.max(timeLeft, 0);
            if (timeLeft <= 0) endTest();
          }, 1000);
        }
        const typed = input.value;
        const spans = promptEl.querySelectorAll("span");
        let correctCount = 0;
        spans.forEach((span, i) => {
          span.className = "";
          if (i < typed.length) {
            if (typed[i] === text[i]) { span.classList.add("correct"); correctCount++; }
            else span.classList.add("wrong");
          } else if (i === typed.length) {
            span.classList.add("current");
          }
        });
        document.getElementById("acc").textContent = Math.round((correctCount / typed.length) * 100 || 100) + "%";
        if (typed.length >= text.length) endTest();
      });

      function endTest() {
        if (finished) return;
        finished = true;
        clearInterval(timer);
        const elapsedMin = Math.max((Date.now() - startTime) / 60000, 1 / 60);
        const words = input.value.trim().split(/\s+/).length;
        document.getElementById("wpm").textContent = Math.round(words / elapsedMin);
      }

      reset();
    </script>
  </body>
</html>
