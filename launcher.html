<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Playground — Launcher</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 50% 30%, #1a2744 0%, #0a0f1e 70%);
        color: #e8ecf5;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        padding: 24px;
        text-align: center;
      }
      h1 { font-size: clamp(2rem, 6vw, 3.5rem); letter-spacing: -0.02em; }
      p.sub { color: #9aa7c2; max-width: 34ch; line-height: 1.5; }

      .card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: min(420px, 100%);
      }
      button {
        font-size: 1rem;
        padding: 13px 16px;
        border-radius: 10px;
        border: none;
        background: #3a6df0;
        color: #e8ecf5;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.15s, transform 0.05s;
      }
      button:hover { background: #4f7ef5; }
      button:active { transform: translateY(1px); }
      button.secondary { background: #2a3350; }
      button.secondary:hover { background: #343f63; }
      a.plain { color: #7fa0ff; word-break: break-all; }
    </style>
  </head>
  <body>
    <h1>Playground</h1>
    <p class="sub">A lightweight games and apps hub.</p>

    <div class="card">
      <button id="launch">Launch Playground ↗</button>
      <button id="launchHere" class="secondary">Open in this tab</button>
    </div>

    <p class="sub">
      Direct link:<br />
      <a class="plain" id="direct" href="#" target="_blank" rel="noopener"></a>
    </p>

    <script>
      // ============================================================
      // Your site, served by StaticDelivr (serves .html as a real
      // web page; jsDelivr would only show the source as text).
      //   Branch URL shape:  /gh/USER/REPO/BRANCH/path
      // ============================================================
      // app.svg is the shell that boots the whole site from jsDelivr. jsDelivr serves
      // .svg as image/svg+xml, so the browser renders it (unlike .html, served as
      // text); the SVG's foreignObject holds an iframe + FrameWriter that loads the
      // rest from the SAME subdomain. Using fastly.jsdelivr.net instead of
      // cdn.jsdelivr.net (blocked by some antivirus). Other interchangeable mirrors:
      // gcore / testingcf / originfastly / quantil .jsdelivr.net — just swap the host.
      const SITE_URL = "https://fastly.jsdelivr.net/gh/aceislate/playground-site@main/app.svg";
      // ============================================================

      const direct = document.getElementById("direct");
      direct.href = SITE_URL;
      direct.textContent = SITE_URL;

      document.getElementById("launch").addEventListener("click", () => {
        window.open(SITE_URL, "_blank", "noopener");
      });
      document.getElementById("launchHere").addEventListener("click", () => {
        window.location.href = SITE_URL;
      });
    </script>
  </body>
</html>
