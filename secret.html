<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Secret Games | Playground</title>
    <meta name="robots" content="noindex, nofollow" />
  </head>
  <body>
    <canvas id="particle-canvas"></canvas>

    <div id="gate" class="container" style="max-width:520px;">
      <div style="margin-top:15vh;text-align:center;">
        <h1 class="page-title">Enter Code</h1>
        <input type="password" id="code-input" class="search-bar" placeholder="Code..." autocomplete="off" />
        <p id="gate-error" style="color:#ff6b6b;display:none;margin-top:10px;">Wrong code.</p>
      </div>
    </div>

    <div id="panel" class="container" style="display:none;">
      <div class="page-head"><h1 class="page-title">Secret Games</h1><span class="pill" id="count-pill"></span></div>
<label class="search-wrap"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="text" id="search" class="search-bar" placeholder="Search" autocomplete="off" /></label>
      <div id="loader" class="loader"></div>
      <div id="game-container" class="grid"></div>
      <p id="empty-msg" class="empty-msg" style="display:none;">No games matched your search.</p>
    </div>

    <button id="back-to-top" style="display: none;">&uarr;</button>

    <nav class="dock">
      <a href="index.html" data-nav="home" aria-label="Home"><span class="icon icon-home"></span></a>
      <a href="games.html" data-nav="games" aria-label="Games"><span class="icon icon-games"></span></a>
      <a href="apps.html" data-nav="apps" aria-label="Apps"><span class="icon icon-apps"></span></a>
      <a href="settings.html" data-nav="settings" aria-label="Settings"><span class="icon icon-settings"></span></a>
    </nav>

    <script src="js/main.js"></script>
    <script src="js/particles.js"></script>
    <script>
      const CODE = "carson";
      let games = [];

      function cardHtml(g, i) {
        const isExternal = g.external === true || /^https?:\/\//i.test(g.link);
        const href = isExternal
          ? g.link
          : `play.html?src=${encodeURIComponent(g.link)}&title=${encodeURIComponent(g.title)}&img=${encodeURIComponent(g.imgSrc)}`;
        const target = isExternal ? ' target="_blank" rel="noopener noreferrer"' : "";

        return `<a class="card-link" style="--i:${i % 24}" href="${href}"${target}>
          <div class="card">
            <div class="card-img-wrap"><img src="${g.imgSrc}" alt="${g.title}" loading="lazy" /></div>
            <div class="card-body"><p class="card-title">${g.title}</p></div>
          </div>
        </a>`;
      }

      function render(list) {
        const container = document.getElementById("game-container");
        container.innerHTML = list.map(cardHtml).join("");
        document.getElementById("empty-msg").style.display = list.length ? "none" : "block";
      }

      function loadGames() {
        fetch("config/secret-games.json")
          .then((r) => r.json())
          .then((data) => {
            games = data;
            document.getElementById("count-pill").textContent = `${games.length} games`;
            render(games);
            document.getElementById("loader").style.display = "none";
          })
          .catch((err) => {
            document.getElementById("loader").style.display = "none";
            console.error("Error loading secret games:", err);
          });
      }

      document.getElementById("search").addEventListener("keyup", (e) => {
        const filter = e.target.value.toUpperCase();
        render(games.filter((g) => g.title.toUpperCase().includes(filter)));
      });

      const backToTopButton = document.getElementById("back-to-top");
      window.onscroll = function () {
        backToTopButton.style.display = document.documentElement.scrollTop > 200 ? "block" : "none";
      };
      backToTopButton.onclick = function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      function unlock() {
        document.getElementById("gate").style.display = "none";
        document.getElementById("panel").style.display = "block";
        loadGames();
      }

      document.getElementById("code-input").addEventListener("keyup", (e) => {
        if (e.key === "Enter") {
          if (e.target.value.trim().toLowerCase() === CODE) {
            localStorage.setItem("secretUnlocked", "1");
            unlock();
          } else {
            document.getElementById("gate-error").style.display = "block";
          }
        }
      });

      if (localStorage.getItem("secretUnlocked") === "1") {
        unlock();
      }
    </script>
  </body>
</html>
